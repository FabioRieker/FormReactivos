<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Gestión de Inventario Móvil</ion-title>
    <!-- Botón de Modo Oscuro -->
    <ion-buttons slot="end">
      <ion-button (click)="toggleDarkMode()" fill="clear" aria-label="Cambiar modo oscuro">
        <ion-icon slot="icon-only" [name]="isDarkMode() ? 'sunny' : 'moon'"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form-container">
    <div class="form-header">
      <h2>Inserción de Producto</h2>
      <p>Complete los datos del producto para darlo de alta en el almacén.</p>
    </div>

    <!-- Enlace del FormGroup definido en TypeScript -->
    <form [formGroup]="productoForm" (ngSubmit)="onSubmit()">
      <ion-list lines="full">
        <!-- Campo Código de Barras (SKU) -->
        <ion-item>
          <ion-input
            label="Código de Barras (SKU)"
            labelPlacement="floating"
            type="text"
            formControlName="sku"
            [errorText]="skuError"
            placeholder="Ej: ABC123XYZ456"
            maxlength="12"
            helperText="Exactamente 12 caracteres alfanuméricos">
          </ion-input>
        </ion-item>

        <!-- Campo Nombre del Producto -->
        <ion-item>
          <ion-input
            label="Nombre del Producto"
            labelPlacement="floating"
            type="text"
            formControlName="nombre"
            [errorText]="nombreError"
            placeholder="Ej: Martillo Profesional">
          </ion-input>
        </ion-item>

        <!-- Campo Categoría con ion-select -->
        <ion-item>
          <ion-select
            label="Categoría"
            labelPlacement="floating"
            placeholder="Seleccione una categoría"
            formControlName="categoria"
            [errorText]="categoriaError">
            <ion-select-option value="Electrónica">Electrónica</ion-select-option>
            <ion-select-option value="Herramientas">Herramientas</ion-select-option>
            <ion-select-option value="Consumibles">Consumibles</ion-select-option>
          </ion-select>
        </ion-item>

        <!-- Campo Stock Mínimo con teclado numérico nativo -->
        <ion-item>
          <ion-input
            label="Stock Mínimo"
            labelPlacement="floating"
            type="number"
            inputmode="numeric"
            formControlName="stockMinimo"
            [errorText]="stockMinimoError"
            placeholder="Ej: 15"
            min="1">
          </ion-input>
        </ion-item>

        <!-- Campo Fecha de Nacimiento (No superior a hoy) -->
        <ion-item>
          <ion-input
            label="Fecha de Nacimiento"
            labelPlacement="floating"
            type="date"
            formControlName="fechaNacimiento"
            [errorText]="fechaNacimientoError"
            [max]="maxDate">
          </ion-input>
        </ion-item>

        <!-- Campo Contraseña -->
        <ion-item>
          <ion-input
            label="Contraseña de Operario"
            labelPlacement="floating"
            type="password"
            formControlName="contrasena"
            [errorText]="contrasenaError"
            placeholder="Mínimo 6 caracteres">
          </ion-input>
        </ion-item>
      </ion-list>

      <div class="ion-padding-top">
        <!-- Botón dinámico que responde al Signal -->
        <ion-button expand="block" type="submit" [disabled]="productoForm.invalid || isSubmitting()">
          <span *ngIf="!isSubmitting()">Guardar Producto</span>
          <ion-spinner name="crescent" *ngIf="isSubmitting()"></ion-spinner>
        </ion-button>

        <!-- Botón para descargar el PDF con los datos enviados -->
        <ion-button
          expand="block"
          color="secondary"
          fill="outline"
          (click)="descargarPDF()"
          [disabled]="!lastSubmittedData"
          class="ion-margin-top">
          <ion-icon slot="start" name="download-outline"></ion-icon>
          Descargar PDF del Producto Enviado
        </ion-button>

        <!-- Botón para comparar con el Formulario Template-Driven -->
        <ion-button expand="block" fill="clear" routerLink="/driven" class="ion-margin-top">
          <ion-icon slot="start" name="swap-horizontal-outline"></ion-icon>
          Comparar con Formulario Template-Driven
        </ion-button>
      </div>
    </form>
  </div>

  <!-- Toast para confirmar guardado local -->
  <ion-toast
    [isOpen]="showToast()"
    message="Producto guardado localmente con éxito en el inventario."
    [duration]="3000"
    color="success"
    (didDismiss)="showToast.set(false)">
  </ion-toast>

  <!-- Alerta informativa de confirmación -->
  <ion-alert
    [isOpen]="showAlert()"
    header="Formulario Enviado"
    subHeader="¡Operación Exitosa!"
    message="El formulario se ha enviado correctamente y los datos han sido registrados en el inventario."
    [buttons]="alertButtons"
    (didDismiss)="showAlert.set(false)">
  </ion-alert>
</ion-content>
